[build]
  command = "npm run build"
  # Next.js schrijft zijn uitvoer naar .next. Niet de hoofdmap gebruiken: de Netlify-plug-in weigert dat.
  publish = ".next"

[build.environment]
  # Next.js 16 vraagt minimaal Node 20.9
  NODE_VERSION = "22"
  # Geheimen-scan van Netlify: de NEXT_PUBLIC-waarden zijn bedoeld om openbaar te zijn (de publishable key werkt
  # alleen binnen de Supabase-beveiliging), en de bouwcache wordt niet online gezet. Al het andere, zoals de
  # service-role-sleutel, DEMO_PASSWORD en AUTH_SECRET in de echte uitvoer, blijft gecontroleerd.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"

# Zonder deze plug-in maakt Netlify geen serverfunctie en geeft elk adres een 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
